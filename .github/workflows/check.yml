name: Check RCPitBoard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: bash -n scripts/setup.sh scripts/update.sh scripts/configure-https.sh scripts/enable-letsencrypt.sh
      - run: bash tests/https-setup.test.sh
      - run: cp .env.example .env && docker compose config --quiet
      - name: Build and start the Debian container
        run: |
          printf '\nBIND_ADDRESS=127.0.0.1\nHTTP_PORT=8080\nHTTPS_PORT=8443\nHTTPS_HOST=127.0.0.1\n' >> .env
          docker compose up -d --build --wait --wait-timeout 120
      - name: Check board and settings without login over HTTP
        run: |
          curl --fail --silent http://127.0.0.1:8080/api/health
          curl --fail --silent http://127.0.0.1:8080/ | grep -q RCPitBoard
          curl --fail --silent http://127.0.0.1:8080/admin | grep -q RCPitBoard
          curl --fail --silent -X PUT http://127.0.0.1:8080/api/settings \
            -H 'Content-Type: application/json' -H 'X-RCPitBoard: 1' \
            --data '{"live_url":"https://lprcoffroad.liverc.com/live/","results_url":"https://lprcoffroad.liverc.com/results/","scroll_speed":30,"refresh_seconds":20}'
          curl --fail --silent http://127.0.0.1:8080/api/settings | grep -q '"scroll_speed":30'
      - name: Check HTTPS using its local CA and shared settings
        run: |
          docker compose cp https:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/rcpitboard-ca.crt"
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors \
            --cacert "$RUNNER_TEMP/rcpitboard-ca.crt" https://127.0.0.1:8443/api/health
          curl --fail --silent --cacert "$RUNNER_TEMP/rcpitboard-ca.crt" https://127.0.0.1:8443/admin | grep -q RCPitBoard
          curl --fail --silent --cacert "$RUNNER_TEMP/rcpitboard-ca.crt" https://127.0.0.1:8443/api/settings | grep -q '"scroll_speed":30'
          curl --fail --silent -X PUT --cacert "$RUNNER_TEMP/rcpitboard-ca.crt" https://127.0.0.1:8443/api/board \
            -H 'Content-Type: application/json' -H 'X-RCPitBoard: 1' --data '{"paused":true}'
          curl --fail --silent http://127.0.0.1:8080/api/board | grep -q '"paused":true'
          docker compose restart https
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors \
            --cacert "$RUNNER_TEMP/rcpitboard-ca.crt" https://127.0.0.1:8443/api/health
      - name: Build and validate GoDaddy TLS support without issuing a certificate
        run: |
          printf 'GODADDY_API_TOKEN=ci-key:ci-secret\nACME_EMAIL=admin@example.com\n' > .env.godaddy
          docker compose -f compose.yaml -f compose.godaddy.yaml config --quiet
          docker compose -f compose.yaml -f compose.godaddy.yaml build https
          docker run --rm rcpitboard-caddy-godaddy:local caddy list-modules | grep -q dns.providers.godaddy
          docker compose -f compose.yaml -f compose.godaddy.yaml run --rm --no-deps \
            -e HTTPS_HOST=pitboard.example.com https caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop test container
        if: always()
        run: docker compose down -v
