name: rcpitboard
services:
  app:
    image: rcpitboard:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:3000"
    volumes:
      - rcpitboard-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  rcpitboard-data:
